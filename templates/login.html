<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body id="login">
<div class="container">
        <div class="card login-card mx-auto">
            <div class="card-body">
           <a href="{{url_for('index')}}"><img class="login-logo d-block mx-auto mb-4" src="../static/img/logo-no-background.png"></a>
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-login mt-4 d-block mx-auto">Login</button>
                </form>
                            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <p style="color:red" class="mt-2">{{messages[0]}}</p>
                {% endif %}
            {% endwith %}

                <div class="signup">
                    <p>Not a member? <a href="{{url_for('register')}}">Signup</a></p>
                </div>

            </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
