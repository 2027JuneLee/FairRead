<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
      <link rel="icon" type="image/png" href="../static/img/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../static/img/apple-touch-icon.png">
  <style>
    :root{
      --brand:#d6c278;         /* gold accent */
      --ink:#0f172a;           /* headings */
      --muted:#475569;         /* body */
      --panel:rgba(255,255,255,.75);
      --ring:linear-gradient(120deg, rgba(214,194,120,.8), rgba(255,255,255,.35));
    }

    /* ===== PAGE BG with grid + glow (mirrors hero section) ===== */
    body{
      font-family:'Playfair Display',serif;
      min-height:100vh;
      margin:0;
      display:grid;
      place-items:center;
      background:
        radial-gradient(1400px 700px at 90% -10%, rgba(214,194,120,.18), transparent 40%),
        radial-gradient(900px 500px at 0% 100%, rgba(214,194,120,.12), transparent 35%),
        linear-gradient(180deg,#f7f8fc 0%,#eef2f7 100%);
      position:relative;
      overflow:hidden;
      isolation:isolate;
    }
    /* grid lines mask like hero-modern::before */
    body::before{
      content:"";
      position:absolute; inset:0;
      background-image:
        linear-gradient(to right, rgba(15,23,42,.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15,23,42,.045) 1px, transparent 1px);
      background-size:26px 26px;
      mask-image: radial-gradient(1100px 600px at 60% 0%, #000 60%, transparent 100%);
      pointer-events:none;
      z-index:0;
    }
    /* soft floating glows */
    .glow, .glow-2{
      position:absolute; filter:blur(40px); opacity:.45; z-index:0;
      pointer-events:none; mix-blend-mode:multiply;
      background: radial-gradient(closest-side, rgba(214,194,120,.45), transparent 60%);
      border-radius:50%;
      animation: float 10s ease-in-out infinite;
    }
    .glow{ width:420px; height:420px; top:12%; left:-6%; }
    .glow-2{ width:320px; height:320px; bottom:-6%; right:6%; animation-duration:12s; }
    @keyframes float{ 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(16px) translateX(8px)} }

    /* ===== CARD ===== */
    .login-card{
      position:relative; z-index:1;
      width:100%; max-width:460px;
      background:var(--panel);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-radius:20px;
      padding:40px 34px;
      box-shadow:0 12px 28px rgba(15,23,42,.12), 0 2px 0 1px rgba(214,194,120,.15) inset;
    }
    .login-card::before{
      content:""; position:absolute; inset:-2px; border-radius:22px; background: var(--ring);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask-composite: exclude; padding:2px; pointer-events:none; opacity:.9;
    }

    .login-logo{ max-width:180px; height:auto; }

    /* Spacing + input sizing */
    .form-stack{ display:grid; gap:14px; margin-top:6px; }
    .form-control{
      border-radius:12px;
      padding:14px 16px;              /* a bit roomier */
      font-size:16px;
      border:1px solid rgba(15,23,42,.12);
    }
    .form-control:focus{
      border-color:var(--brand);
      box-shadow:0 0 0 3px rgba(214,194,120,.25);
    }

    /* Primary action button: slightly larger */
    .btn-login{
      background:var(--ink);
      color:#fff;
      border-radius:14px;
      padding:12px 18px;              /* larger touch target */
      font-size:15px;                 /* up from 16px */
      font-weight:600;
      letter-spacing:.01em;
      transition:transform .25s ease, box-shadow .25s ease, background-color .25s ease;
    }
    .btn-login:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 24px rgba(15,23,42,.18);
      background:#0b1226;
    }

    .helper-row{
      display:flex; justify-content:space-between; align-items:center;
      margin-top:8px; margin-bottom:4px;
      font-size:14px; color:var(--muted);
    }
    .helper-row a{ color:var(--ink); text-decoration:none; border-bottom:1px solid rgba(214,194,120,.35); }
    .helper-row a:hover{ color:var(--brand); border-color:var(--brand); }

    .signup{
      margin-top:18px; font-size:15px; color:var(--muted); text-align:center;
    }
    .signup a{
      color:var(--ink); font-weight:600; text-decoration:none; border-bottom:1px solid rgba(214,194,120,.35);
    }
    .signup a:hover{ color:var(--brand); border-color:var(--brand); }

    .flash-error{ color:#c92a2a; margin-top:12px; font-size:14px; text-align:center; }
  </style>
</head>
<body>

  <!-- background glows -->
  <span class="glow"></span>
  <span class="glow-2"></span>

  <div class="login-card">
    <a href="{{ url_for('index') }}">
      <img class="login-logo d-block mx-auto mb-4" src="../static/img/logo-no-background.png" alt="FairRead logo">
    </a>

    <form action="/login" method="POST" class="mt-2">
      <div class="form-stack">
        <input type="text" class="form-control" placeholder="Username" name="username" required>
        <input type="password" class="form-control" placeholder="Password" name="password" required>
      </div>



      <button type="submit" class="btn btn-login d-block mx-auto mt-4" style="width:50%;">Login</button>
    </form>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p class="flash-error">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}

    <div class="signup">
      Not a member? <a href="{{ url_for('register') }}">Sign up</a>
    </div>
  </div>

</body>
</html>
